<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<body>

    <main class="main-container">

        <header class="app-header">
            <div class="logo-container">
                <img src="./images/tasklogo.png" class="logo-image" alt="logo"/>
                <div class="task-title">
                    <h1 class="logo-heading">Task Manager</h1>
                    <p class="logo-paragraph">Organize your day, one take at time.</p>
                </div>
            </div>
        </header>

        <section class="input-section">
            <form class="input-container" id="task-form">
                <input class="task-input" id="task-input" type="text" placeholder="Enter your task...." >
                <button class="add-task-btn" type="submit">+ Add Task</button>
            </form>
        </section>

        <section class="filter-section">
            <div class="filter-container">
                <button class="filter-btns active" type="button" data-filter="all">All</button>
                <button class="filter-btns" type="button" data-filter="active">Active</button>
                <button class="filter-btns" type="button" data-filter="completed">Completed</button>
            </div>
        </section>

        <section class="task-list-section">
            <div class="task-list-container">
                <div>
                    <h2 class="task-list-heading">My Tasks</h2>
                    <p class="task-list-description">Manage your daily activities</p>
                </div>
                <span class="task-count">0 Tasks</span>
            </div>
            <div>
                <ul class="task-list" id="task-list">
                </ul>
            </div>
            <button type="button" class="clear-completed-btn" id="clear-completed-btn">Clear Completed</button>
        </section>

    </main>
    
    <script src="script.js"></script>
</body>
